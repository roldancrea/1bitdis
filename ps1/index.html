<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1c0a2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Niebla PS1</title>
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1c0a2b;
      --panel: #2a1440;
      --line: #6a3f86;
      --fg: #d9c8e8;
      --accent: #8cff6a;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font-family: "VT323", ui-monospace, monospace;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #app {
      max-width: 560px; margin: 0 auto; min-height: 100%;
      display: flex; flex-direction: column; gap: 10px;
      padding-block: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    .view { position: relative; border: 2px solid var(--line); background: #000; }
    #c {
      display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3;
      image-rendering: pixelated; image-rendering: crisp-edges;
      touch-action: none; cursor: pointer;
    }
    #fade {
      position: absolute; inset: 0; background: var(--bg);
      opacity: 0; pointer-events: none;
      transition: opacity 0.45s steps(5);
    }
    #fade.on { opacity: 1; }
    #title {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      transition: opacity 0.6s steps(4);
    }
    #title.hide { opacity: 0; }
    #title h1 {
      margin: 0; font-weight: normal; font-size: clamp(48px, 15vw, 76px); letter-spacing: 0.25em;
      color: var(--accent); text-shadow: 3px 3px 0 var(--bg), -1px -1px 0 var(--bg);
      padding-left: 0.25em;
    }
    #title p { margin: 0; font-size: 22px; text-shadow: 2px 2px 0 var(--bg); animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    #hud { display: flex; justify-content: space-between; align-items: center; min-height: 30px; gap: 10px; }
    #inv { font-size: 22px; color: var(--accent); letter-spacing: 0.05em; }
    #back {
      font: inherit; font-size: 20px; color: var(--fg); background: transparent;
      border: 1px solid var(--line); padding: 2px 10px; cursor: pointer;
    }
    #back:active, #back:focus-visible { background: var(--line); outline: none; }

    #panel {
      flex: 1; min-height: 180px;
      background: var(--panel); border: 2px solid var(--line);
      box-shadow: inset 0 0 0 2px var(--bg);
      padding: 12px 14px; display: flex; flex-direction: column; gap: 12px;
    }
    #say { font-size: 24px; line-height: 1.15; min-height: 3.5em; }
    .hs-name { color: var(--accent); font-size: 26px; }
    .hs-name::before { content: "▸ "; }
    .more { color: var(--accent); animation: blink 0.8s steps(1) infinite; }
    .ending { display: block; text-align: center; color: var(--accent); letter-spacing: 0.1em; margin-top: 1em; }
    #actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; }
    .act {
      font: inherit; font-size: 22px; color: var(--bg); background: var(--fg);
      border: 0; padding: 8px 16px; cursor: pointer;
      box-shadow: 3px 3px 0 var(--line);
      animation: pop 0.2s steps(2) both;
    }
    .act:active, .act:focus-visible { background: var(--accent); outline: none; transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line); }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main id="app">
    <div class="view">
      <canvas id="c" width="320" height="240"></canvas>
      <div id="fade"></div>
      <div id="title"><h1>NIEBLA</h1><p>toca para empezar</p></div>
    </div>
    <div id="hud"><span id="inv"></span><button id="back" hidden></button></div>
    <section id="panel">
      <div id="say"></div>
      <div id="actions"></div>
    </section>
  </main>
  <script src="lib/three.min.js"></script>
  <script src="js/ps1.js"></script>
  <script src="js/models.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
